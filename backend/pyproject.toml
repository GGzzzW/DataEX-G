[project]
name = "backend"
version = "0.1.0"
description = "Offline desktop toolkit for data cleaning, regression, and spatial analysis"
readme = "README.md"
authors = [
    { name = "GGzzzW", email = "gongzw0204@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "esda>=2.10.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "libpysal>=4.15.0",
    "mgwr>=2.2.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "python-multipart>=0.0.32",
    "pywebview>=6.2.1",
    "scipy>=1.18.1",
    "spreg>=1.9.1",
    "statsmodels>=0.14.6",
]

[project.scripts]
dataex-g = "backend.desktop:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
